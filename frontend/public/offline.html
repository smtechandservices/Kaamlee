<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f2f3f5" />
  <title>Offline · Kaamlee</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f2f3f5;
      color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { margin: 0 0 24px; color: #555; line-height: 1.5; }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      background: #0a0a0a;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Kaamlee" />
    <h1>You're offline</h1>
    <p>Check your internet connection and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
  </main>
  <script>
    window.addEventListener("online", () => location.reload());
  </script>
</body>
</html>
